<!DOCTYPE html>

<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<!-- PWA -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8671A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sieners">
<link rel="apple-touch-icon" href="icons/icon-192.png">

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

<title>Sieners SYV Group — מערכת תמחור</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

:root{

  --or:#E8671A;--tl:#2ABFB0;--dk:#3D3D3D;

  --bg:#F2F2F7;--card:#fff;--border:#E0E0E0;

  --text:#1c1c1e;--muted:#8e8e93;--r:12px;

  --sh:0 2px 16px rgba(0,0,0,.08);

}

body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;direction:rtl;background:var(--bg);color:var(--text)}



/* NAV */

.nav{background:#2d2d2d;display:flex;align-items:center;min-height:52px;padding:0 18px;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 1px 0 rgba(255,255,255,.06)}

.nav-logo{height:32px;object-fit:contain;filter:brightness(0) invert(1);opacity:.9}

.nav-sep{width:1px;height:28px;background:rgba(255,255,255,.15)}

.nav-sub{font-size:12px;color:rgba(255,255,255,.45);font-weight:500}

.nav-btns{margin-right:auto;display:flex;gap:6px}

.nbtn{padding:5px 13px;font-size:12px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.85);cursor:pointer;font-weight:500}

.nbtn:hover{background:rgba(255,255,255,.16)}

.nbtn.or{background:var(--or);border-color:var(--or);color:#fff}



/* TABS */

.tabs-bar{background:#222;display:flex;align-items:flex-end;gap:2px;padding:0 16px;min-height:34px;overflow-x:auto}

.ptab{padding:6px 14px;font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid transparent;border-bottom:none;flex-shrink:0;transition:all .12s}

.ptab:hover{color:rgba(255,255,255,.75)}

.ptab.act{background:var(--bg);color:var(--text);font-weight:600;border-color:rgba(0,0,0,.1)}

.ptab-x{opacity:.35;font-size:14px}

.ptab-x:hover{opacity:1;color:#f44}

.ptab-add{padding:6px 10px;color:rgba(255,255,255,.3);cursor:pointer;font-size:16px;align-self:center}

.ptab-add:hover{color:#fff}



/* MAIN */

.main{max-width:820px;margin:0 auto;padding:20px 16px}



/* TOPBAR */

.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 18px;margin-bottom:16px;box-shadow:var(--sh)}

.tb-l strong{display:block;font-size:15px;font-weight:600}

.tb-l span{font-size:12px;color:var(--muted)}

.pill{font-size:11px;padding:4px 12px;border-radius:20px;background:rgba(42,191,176,.12);color:var(--tl);border:1px solid var(--tl);font-weight:600}



/* PROGRESS */

.prog{display:flex;align-items:center;margin-bottom:16px;overflow-x:auto}

.ps{display:flex;align-items:center}

.pdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;border:2px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s}

.pdot.done{background:var(--tl);color:#fff;border-color:var(--tl)}

.pdot.act{background:var(--or);color:#fff;border-color:var(--or)}

.plbl{font-size:11px;color:var(--muted);margin:0 6px;white-space:nowrap}

.plbl.act{color:var(--or);font-weight:700}

.plbl.done{color:var(--tl)}

.pline{width:16px;height:2px;background:var(--border);flex-shrink:0;border-radius:2px}



/* LIVE SUM */

.lsum{background:linear-gradient(135deg,#f0fffd,#fff9f5);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}

.lsum-t{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}

.sr{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}

.sr.sep{border-top:1.5px solid var(--border);margin-top:5px;padding-top:6px;font-weight:700}

.sr.sub{color:var(--muted);font-size:12px;padding-right:8px}

.sr.or{color:var(--or);font-weight:600}

.sr.tl{color:var(--tl);font-size:15px;font-weight:700}



/* CARD */

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px;margin-bottom:14px;box-shadow:var(--sh)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;background:rgba(232,103,26,.1);color:var(--or);margin-bottom:9px;text-transform:uppercase;letter-spacing:.4px}

.wq{font-size:19px;font-weight:700;margin-bottom:4px;line-height:1.3}

.wh{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}



/* INPUTS */

.bnum{font-size:26px;font-weight:700;width:110px;padding:9px 13px;border:2px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);text-align:center}

.bnum:focus{outline:none;border-color:var(--or)}

.tin{width:100%;padding:10px 13px;font-size:15px;border:2px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text)}

.tin:focus{outline:none;border-color:var(--or)}

input[type=password].tin{width:100%}



/* BUTTONS */

.grid{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}

.opt{padding:9px 18px;font-size:13px;border:2px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;font-weight:500}

.opt:hover{border-color:var(--tl);color:var(--tl)}

.opt.sel{background:var(--or);color:#fff;border-color:var(--or)}

.yn{padding:11px 26px;font-size:14px;border:2px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);cursor:pointer;font-weight:600;min-width:110px}

.yn.y{background:var(--tl);color:#fff;border-color:var(--tl)}

.yn.n{background:var(--dk);color:#fff;border-color:var(--dk)}

.nxt{padding:10px 24px;font-size:13px;font-weight:700;border:none;border-radius:var(--r);background:var(--or);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.nxt:hover{opacity:.88}

.bck{padding:10px 16px;font-size:13px;border:2px solid var(--border);border-radius:var(--r);background:none;color:var(--muted);cursor:pointer;font-weight:500}

.bck:hover{background:var(--bg)}

.skip{padding:10px 16px;font-size:12px;border:2px solid var(--tl);border-radius:var(--r);background:none;color:var(--tl);cursor:pointer;font-weight:600}

.motors{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}

.mbtn{padding:6px 12px;font-size:12px;border:2px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-weight:500}

.mbtn:hover{border-color:var(--tl)}

.mbtn.sel{background:var(--or);color:#fff;border-color:var(--or)}

.added{font-size:12px;color:var(--tl);padding:8px 12px;background:rgba(42,191,176,.08);border-radius:8px;margin-bottom:10px}

.info{background:rgba(42,191,176,.08);border:1px solid var(--tl);border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:14px}

.pprev{font-size:13px;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}

.pprev strong{color:var(--or)}



/* FLOOR TABS */

.ftabs{display:flex;gap:5px;margin-bottom:13px;flex-wrap:wrap}

.ftab{padding:4px 13px;font-size:12px;border:2px solid var(--border);border-radius:20px;background:var(--card);color:var(--muted);font-weight:500}

.ftab.act{background:var(--or);color:#fff;border-color:var(--or)}

.ftab.done{border-color:var(--tl);color:var(--tl)}



/* PHASE BANNER */

.phase-done{background:linear-gradient(135deg,rgba(42,191,176,.12),rgba(42,191,176,.05));border:2px solid var(--tl);border-radius:var(--r);padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

.phase-done-t{font-size:14px;font-weight:700;color:var(--tl)}

.phase-done-s{font-size:12px;color:var(--muted);margin-top:2px}



/* RESULT */

.rcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}

.rhead{padding:10px 14px;background:#fafafa;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}

th{text-align:right;padding:7px 11px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px}

td{padding:7px 11px;border-bottom:1px solid var(--border)}

tr:last-child td{border-bottom:none}

tr:hover td{background:#fafffe}

.totbox{background:var(--dk);color:#fff;border-radius:var(--r);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

.totbox .lb{font-size:12px;opacity:.55;margin-bottom:3px}

.totbox .vl{font-size:28px;font-weight:700;color:var(--tl)}

.sub-box{border:2px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}

.sub-box.tin{border-color:#2980b9;background:rgba(41,128,185,.04)}

.sub-box.elec{border-color:#8e44ad;background:rgba(142,68,173,.04)}

.ctbl td{padding:8px 12px;border-bottom:1px solid var(--border)}

.ctbl tr:last-child td{border-bottom:none}

.ctbl .hlrow{background:rgba(42,191,176,.07)}



/* MODALS */

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

.ov.open{display:flex}

.modal{background:var(--card);border-radius:16px;padding:28px;max-width:600px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}

.modal h2{font-size:17px;font-weight:700;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:11px}

.prow{display:grid;grid-template-columns:1fr 86px 86px;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg)}

.pname{font-size:13px;font-weight:500}

.pin{width:76px;padding:4px 7px;font-size:12px;border:1.5px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);text-align:left}

.pin:focus{outline:none;border-color:var(--or)}

.sec-h{font-size:11px;font-weight:700;color:var(--or);padding:7px 0 3px;text-transform:uppercase;letter-spacing:.4px}

.tnav{display:flex;gap:3px;margin-bottom:14px;border-bottom:2px solid var(--border)}

.tnav button{padding:7px 14px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-2px}

.tnav button.act{color:var(--or);border-bottom-color:var(--or);font-weight:700}

.tpane{display:none}.tpane.act{display:block}

.err{color:#ff3b30;font-size:13px;margin-top:7px;display:none}



/* CLIENT REPORT */

.cr-wrap{font-family:'Helvetica Neue',Arial,sans-serif;direction:rtl;color:#1a1a1a;background:#fff}

/* ── PRINT PAGE ── */
@media print{
  @page{size:A4 portrait;margin:0}
  .nav,.tabs-bar,.bck,.nxt,.skip,.lsum,.nav-btns,.no-print,
  #cr-contact,#cr-phone,#cr-email,.cr-modal-header{display:none!important}
  .cr-wrap{width:210mm;min-height:297mm}
  .cr-page-break{page-break-after:always}
}

/* ── HEADER ── */
.cr-header{
  background:#fff;
  border-bottom:3px solid #1a1a1a;
  padding:28px 36px 20px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
}
.cr-header-right{display:flex;flex-direction:column;gap:6px}
.cr-logo-img{height:44px;object-fit:contain;filter:none}
.cr-company-sub{font-size:10px;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.cr-header-left{text-align:left;display:flex;flex-direction:column;gap:4px;min-width:200px}
.cr-quote-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:2px}
.cr-quote-num{font-size:22px;font-weight:800;color:#1a1a1a;letter-spacing:-0.5px}
.cr-quote-date{font-size:11px;color:#666;margin-top:2px}

/* ── PROJECT BAND ── */
.cr-proj-band{
  background:#1a1a1a;
  color:#fff;
  padding:16px 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.cr-proj-name{font-size:18px;font-weight:800;letter-spacing:-.3px}
.cr-proj-client{font-size:12px;opacity:.65;margin-top:2px}
.cr-proj-right{text-align:left}
.cr-proj-contact-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;margin-bottom:2px}
.cr-proj-contact-val{font-size:12px;font-weight:600}

/* ── META ROW ── */
.cr-meta-row{
  border-bottom:1px solid #e8e8e8;
  padding:12px 36px;
  display:flex;
  gap:32px;
  background:#fafafa;
}
.cr-meta-cell{display:flex;flex-direction:column;gap:2px}
.cr-meta-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#aaa}
.cr-meta-val{font-size:12px;font-weight:600;color:#1a1a1a}

/* ── SECTION HEADER ── */
.cr-sec-head{
  background:#f5f5f5;
  border-right:4px solid #1a1a1a;
  padding:10px 36px 10px 24px;
  margin-top:4px;
  display:flex;align-items:center;gap:10px;
}
.cr-sec-num{
  width:22px;height:22px;border-radius:50%;
  background:#1a1a1a;color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.cr-sec-title{font-size:12px;font-weight:700;color:#1a1a1a;letter-spacing:.2px}

/* ── TABLE ── */
.cr-table{width:100%;border-collapse:collapse;font-size:11.5px}
.cr-table th{
  background:#1a1a1a;color:#fff;
  padding:8px 12px;
  font-size:9px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  text-align:right;
}
.cr-table th:last-child{text-align:center;width:80px}
.cr-table td{
  padding:9px 12px;
  border-bottom:1px solid #ebebeb;
  vertical-align:middle;
  color:#1a1a1a;
}
.cr-table tr:last-child td{border-bottom:none}
.cr-table tr:nth-child(even) td{background:#fafafa}
.cr-table td:last-child{text-align:center;font-weight:700;font-size:12px;white-space:nowrap}
.cr-row-num{
  width:20px;height:20px;border-radius:50%;
  background:#f0f0f0;color:#555;
  font-size:9px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
  margin-left:6px;flex-shrink:0;vertical-align:middle;
}

/* ── PRICE BOX ── */
.cr-price-box{
  margin:20px 36px;
  border:2px solid #1a1a1a;
  border-radius:4px;
  overflow:hidden;
}
.cr-price-head{
  background:#1a1a1a;color:#fff;
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.cr-price-head-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.6}
.cr-price-total{font-size:28px;font-weight:800;letter-spacing:-.5px}
.cr-price-note{padding:10px 20px;font-size:10px;color:#666;background:#f9f9f9;border-top:1px solid #e8e8e8}

/* ── LEGAL ── */
.cr-legal-box{
  margin:0 36px 16px;
  border:1.5px solid #1a1a1a;
  border-radius:4px;
  padding:12px 16px;
  font-size:11px;font-weight:700;
  color:#1a1a1a;
  text-align:center;
  letter-spacing:.3px;
  background:#fff;
}
.cr-terms-box{
  margin:0 36px 20px;
  font-size:10px;
  color:#555;
  line-height:1.7;
}
.cr-terms-box h4{font-size:10px;font-weight:800;color:#1a1a1a;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.cr-terms-box li{list-style:none;padding:3px 0;border-bottom:1px solid #f0f0f0;display:flex;gap:6px}
.cr-terms-box li::before{content:"—";color:#1a1a1a;font-weight:700;flex-shrink:0}
.cr-terms-box li:last-child{border:none}

/* ── FOOTER ── */
.cr-foot-bar{
  background:#1a1a1a;
  color:#fff;
  padding:12px 36px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:auto;
}
.cr-foot-brand{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.cr-foot-info{font-size:10px;opacity:.45;text-align:left}

@media print{.nav,.tabs-bar,.bck,.nxt,.skip,.lsum,.nav-btns,.no-print{display:none!important}}

/* ═══ iPhone / Mobile ═══ */
@media(max-width:600px){
  body{-webkit-text-size-adjust:100%;overflow-x:hidden}

  /* nav */
  .nav{min-height:44px;padding:0 12px;padding-top:env(safe-area-inset-top,0);gap:8px}
  .nav-sub{display:none}
  .nbtn{padding:6px 10px;font-size:11px}

  /* tabs */
  .tabs-bar{min-height:38px;padding:0 8px}
  .ptab{padding:6px 10px;font-size:11px}

  /* main */
  .main{padding:12px 10px;padding-bottom:calc(72px + env(safe-area-inset-bottom,0))}

  /* cards */
  .card{padding:16px;margin-bottom:10px}
  .wq{font-size:16px}
  .wh{font-size:12px}

  /* buttons — larger touch targets */
  .opt{padding:11px 16px;font-size:13px;min-height:44px}
  .yn{padding:13px 22px;font-size:14px;min-height:44px}
  .nxt{padding:13px 20px;font-size:14px;min-height:44px;width:100%}
  .bck{padding:13px 16px;font-size:13px;min-height:44px}
  .skip{min-height:44px;padding:13px 16px}

  /* live sum */
  .lsum{padding:10px 12px}
  .sr{font-size:12px}

  /* inputs */
  .bnum{font-size:22px;width:90px}
  .tin{font-size:16px;padding:12px}/* 16px מונע zoom ב-iOS */

  /* result/table */
  table{font-size:11px}
  td,th{padding:6px 8px}
  .totbox .vl{font-size:24px}

  /* modal */
  .modal{padding:20px 16px;width:96%}

  /* navigation row */
  .nav-btns{gap:4px}

  /* top bar */
  .topbar{padding:10px 14px}
  .tb-l strong{font-size:14px}

  /* progress dots — smaller */
  .pdot{width:22px;height:22px;font-size:10px}
  .plbl{font-size:10px}

  /* logout button — floating */
  #mobile-logout{
    position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));
    left:14px;z-index:500;
    background:#3d3d3d;color:rgba(255,255,255,0.7);
    border:none;border-radius:20px;
    padding:7px 14px;font-size:11px;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
}

</style>

</head>

<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen" style="
  position:fixed;inset:0;z-index:9999;
  background:#1a1a1a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;
  padding-top:env(safe-area-inset-top,32px);
  padding-bottom:env(safe-area-inset-bottom,32px);
">
  <div style="width:72px;height:72px;background:#E8671A;border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
    <svg width="38" height="38" viewBox="0 0 512 512" fill="white"><text x="256" y="360" font-family="Arial" font-weight="800" font-size="380" text-anchor="middle">S</text></svg>
  </div>
  <div style="font-size:22px;font-weight:700;color:white;margin-bottom:4px;text-align:center;">Sieners SYV Group</div>
  <div style="font-size:14px;color:rgba(255,255,255,0.45);margin-bottom:40px;text-align:center;">מערכת תמחור — כניסה לעובדים</div>

  <div style="width:100%;max-width:320px;">
    <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px;font-weight:500;">סיסמת חברה</div>
    <input
      id="login-pw"
      type="password"
      placeholder="הכנס סיסמא..."

<script>

'use strict';



// ═══════════════════════════════════════════════════════════════

// PRICES & MARKUP

// ═══════════════════════════════════════════════════════════════

const MOTORS=[1.1,2.2,3,4,5.5,6,7.5,10,11,12,15,22];

const MBASE=3, MSURCH=400;



function defP(){return{

  fans:{'C-1000':{pc:6500,pi:1200},'C-900':{pc:6000,pi:900},'C-800':{pc:5500,pi:800},'C-710':{pc:3800,pi:710},'C-630':{pc:3000,pi:600},'C-280-C400':{pc:2200,pi:400}},

  sil:{'C-1000':{p1:1945,p2:2500,i:450},'C-900':{p1:1741,p2:2200,i:450},'C-800':{p1:1569,p2:1500,i:450},'C-710':{p1:1343,p2:1200,i:450},'C-630':{p1:900,p2:750,i:450},'C-280-C400':{p1:500,p2:500,i:450}},

  dmp:{fd:{pc:1150,ic:450},fsd:{pc:1650,ic:450},nr:{pc:800,ic:450},sw:{pc:1500,ic:450}},

  cab:{'כבל 1–2.5':{pc:6.2,ic:7},'כבל 4–6':{pc:8.5,ic:7},'כבל 10–16':{pc:22.5,ic:7}},

  duct:[{k:'d125',n:'תעלה 1.25',u:'מ"ר',pc:47,ic:57},{k:'dblk',n:'פח שחור',u:'מ"ר',pc:350,ic:150},{k:'d08',n:'תעלה 0.8',u:'מ"ר',pc:38,ic:50}],

  gr:{'גריל עד 0.15':{pc:136,ic:70},'גריל עד 0.3':{pc:227,ic:70},'גרילים עד 0.5':{pc:450,ic:70},'גרילים מעל 1':{pc:910,ic:70}},

  board:{pc:1700,ic:500},co_hub:{pc:2000,ic:100},co_det:{pc:220,ic:70},cab_side:70,

  elbow03:{pc:250,ic:120},elbow015:{pc:200,ic:120},gr_bld:{pc:136,ic:70},

  vent:{pc:150,ic:120},spiral:{pc:17,ic:50},flex:{pc:22,ic:45},rf:{pc:3200,ic:400}

};}

function defM(){return{mgmt:5,acc:7,oh:20,pr:60};}



let P=defP();

let M=defM();

const sP=()=>saveProj();

const sM=()=>saveProj();

const fmt=n=>'₪'+Math.round(n).toLocaleString('he-IL');

const fprice=(m,mi)=>P.fans[m].pc+(mi>MBASE?(mi-MBASE)*MSURCH:0);



// ═══════════════════════════════════════════════════════════════

// PROJECTS

// ═══════════════════════════════════════════════════════════════

let projects=[];

let curId=null;

const ADMIN_PW='sieners2024';



function loadProj(){
  if(window.electronAPI){
    // Electron: load from file (async init)
    window.electronAPI.loadData().then(res=>{
      if(res.ok && res.data){
        projects=res.data.projects||[];
        P=res.data.prices||defP();
        M=res.data.markup||defM();
      }
      if(!projects.length)newProject();
      else applyProj(projects[projects.length-1].id);
    });
  } else {
    try{projects=JSON.parse(localStorage.getItem('sn_proj')||'[]');}catch(e){projects=[];}
  }
}

function saveProj(){
  if(window.electronAPI){
    window.electronAPI.saveData({projects, prices:P, markup:M});
  } else {
    try{localStorage.setItem('sn_proj',JSON.stringify(projects));}catch(e){}
  }
}



// currentStep is the top-level screen: 'intro'|'parking'|'building'|'roof'|'done'

function freshSt(){

  return{

    currentStep:'intro',

    pn:'',pc:'',aboveFloors:0,_introQ:0,

    // ── PARKING DATA (sealed when moving to building) ──

    parkData:{floors:0,fd:{},done:false,_floor:0,_step:0,_fanI:0,_dmpT:'',_grT:''},

    // ── BUILDING DATA ──

    buildData:{groups:[],_nextFloor:1,done:false},

    // ── ROOF DATA ──

    roofData:{done:false},

  };

}



function newProject(){

  const id='p'+Date.now();

  projects.push({id,name:'פרויקט חדש',client:'',locked:false,st:freshSt()});

  curId=id;saveProj();renderTabs();applyProj(id);

}

function normalizeSt(st){

  // After JSON.parse, object keys that were numbers become strings.

  // Normalize fd keys back to numbers so fd[0] works everywhere.

  if(st.parkData&&st.parkData.fd){

    const fd=st.parkData.fd;

    const keys=Object.keys(fd);

    keys.forEach(k=>{

      if(typeof k==='string'&&!isNaN(k)){

        fd[parseInt(k)]=fd[k];

        delete fd[k];

      }

    });

  }

  return st;

}



function applyProj(id){

  curId=id;

  const proj=projects.find(p=>p.id===id);

  if(!proj)return;

  St=normalizeSt(JSON.parse(JSON.stringify(proj.st)));

  renderTabs();render();

}

function saveCur(){

  const proj=projects.find(p=>p.id===curId);

  if(!proj||proj.locked)return;

  proj.st=JSON.parse(JSON.stringify(St));

  proj.name=St.pn||'פרויקט חדש';

  proj.client=St.pc||'';

  saveProj();

}

function lockProject(){

  const proj=projects.find(p=>p.id===curId);

  if(!proj||!confirm('נעל פרויקט?'))return;

  proj.locked=true;saveProj();renderTabs();alert('✓ נעול');

}

function closeProj(id,e){

  e.stopPropagation();

  if(!confirm('למחוק?'))return;

  projects=projects.filter(p=>p.id!==id);saveProj();

  if(curId===id){if(projects.length)applyProj(projects[projects.length-1].id);else newProject();}

  else renderTabs();

}

function renderTabs(){

  const b=document.getElementById('tabs-bar');

  b.innerHTML=projects.map(p=>`<div class="ptab ${p.id===curId?'act':''}" onclick="applyProj('${p.id}')">

    ${p.locked?'🔒 ':''}${p.name||'פרויקט חדש'}${p.client?' — '+p.client:''}

    <span class="ptab-x" onclick="closeProj('${p.id}',event)">×</span>

  </div>`).join('')+`<div class="ptab-add" onclick="newProject()">＋</div>`;

}



// ═══════════════════════════════════════════════════════════════

// GLOBAL STATE & RENDER ROUTER

// ═══════════════════════════════════════════════════════════════

let St=freshSt();



function render(){

  saveCur();

  // Update header

  document.getElementById('p-name').textContent=St.pn||'פרויקט חדש';

  document.getElementById('p-client').textContent=St.pc?'לקוח: '+St.pc:'לקוח: —';

  // Progress bar

  const pls=['פרטי פרויקט','חניון','מבנה','גג','סיכום'];

  const pi={intro:0,parking:1,building:2,roof:3,done:4}[St.currentStep]??0;

  document.getElementById('prog').innerHTML=pls.map((l,i)=>{

    const d=i<pi,a=i===pi;

    return`<div class="ps"><div class="pdot ${d?'done':a?'act':''}">${d?'✓':(i+1)}</div><div class="plbl ${a?'act':d?'done':''}">${l}</div>${i<4?'<div class="pline"></div>':''}</div>`;

  }).join('');

  // Locked?

  const proj=projects.find(p=>p.id===curId);

  if(proj&&proj.locked){screenLocked();return;}

  // Route to current screen

  if(St.currentStep==='intro')screenIntro();

  else if(St.currentStep==='parking')screenParking();

  else if(St.currentStep==='building')screenBuilding();

  else if(St.currentStep==='roof')screenRoof();

  else if(St.currentStep==='done')screenDone();

}



function setPill(t){document.getElementById('p-pill').textContent=t;}



function screenLocked(){

  document.getElementById('lsum').style.display='none';

  setPill('🔒 נעול');

  document.getElementById('screen').innerHTML=`<div class="card" style="text-align:center">

    <div style="font-size:40px;margin-bottom:10px">🔒</div>

    <div class="wq">הפרויקט ננעל</div>

    <div style="font-size:13px;color:var(--muted);margin:8px 0 18px">ניתן לצפות בסיכום ולהפיק הצעת מחיר</div>

  </div>`;

}

const IQS=[

  {k:'pn',q:'מה שם הפרויקט?',ph:'לדוגמה: מגדל הים, רמת גן',t:'txt'},

  {k:'aboveFloors',q:'כמה קומות מעל הקרקע?',ph:'לא כולל חניון וגג',t:'num'},

];

function screenIntro(){

  document.getElementById('lsum').style.display='none';

  setPill('שלב 1 — פרטי פרויקט');

  const i=St._introQ||0, q=IQS[i];

  const v=St[q.k]||'';

    <div class="badge">📋 פרטי פרויקט ${i+1}/${IQS.length}</div>

    <div style="display:flex;gap:8px;margin-top:18px">

      ${i>0?`<button class="bck" onclick="St._introQ--;render()">→ חזור</button>`:''}

      <button class="nxt" onclick="introNext()">המשך ←</button>

  </div>`;

  setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);

}

function introNext(){

  const el=document.getElementById('inp'), v=el?el.value.trim():'';

  if(!v){shk('inp');return;}

  const i=St._introQ||0, q=IQS[i];

  St[q.k]=q.t==='num'?(parseInt(v)||0):v;

  if(i+1>=IQS.length){St.currentStep='parking';St._introQ=0;}

  else St._introQ=i+1;

  render();

}

// SCREEN 1 — PARKING

// ═══════════════════════════════════════════════════════════════

// All parking state lives in St.parkData

// When done, St.parkData.done=true and St.currentStep='building'



function initPF(){return{fc:0,fans:[],hasSil:null,silT:null,silDir:null,hasDmp:null,dmps:[],hasNR:null,nrQ:0,hasSW:null,swQ:0,ducts:[],cabT:'',cabM:0,hasB:null,bQ:0,hasCO:null,coQ:0,hasGr:null,grs:[],_dmpT:'',_grT:''};}



// Parking steps — one named array, no index arithmetic elsewhere

const PS=['FC','FANS','SIL_Q','SIL_TYPE','SIL_DIR','DMP_Q','DMP_LOOP','NR_Q','NR_QTY','SW','DUCTS','CAB_T','CAB_M','BRD_Q','BRD_QTY','CO_Q','CO_QTY','GR_Q','GR_LOOP'];



function screenParking(){

  const pd=St.parkData;

  setPill('שלב 2 — חניון');

  document.getElementById('lsum').style.display='block';

  updSum();



  // PARKING DONE — show choice screen

  if(pd.done && pd._showDoneScreen){

    const {eq,ins}=calcParking();

    document.getElementById('screen').innerHTML=`

      <div class="card" style="text-align:center;padding:36px 28px">

        <div style="font-size:48px;margin-bottom:12px">✅</div>

        <div class="wq" style="margin-bottom:6px">החניון הושלם!</div>

        <div style="font-size:13px;color:var(--muted);margin-bottom:24px">

          ציוד: ${fmt(eq)} | התקנה: ${fmt(ins)} | <strong>סה"כ: ${fmt(eq+ins)}</strong>

        </div>

        <div style="display:flex;flex-direction:column;gap:12px;max-width:320px;margin:0 auto">

          <button class="nxt" style="justify-content:center;padding:14px 24px;font-size:14px" onclick="parkingContinueToBuilding()">

            המשך לשלב המבנה ←

          </button>

          <button class="bck" style="border-color:var(--tl);color:var(--tl);padding:14px 24px;font-size:14px;font-weight:700" onclick="parkingFinishOnly()">

            💾 סיים ושמור — ללא מבנה וגג

          </button>

          <button class="bck" style="font-size:13px" onclick="St.parkData.done=false;St.parkData._showDoneScreen=false;St.parkData._step=PS.length-1;render()">

            → חזור לעריכת חניון

          </button>

        </div>

      </div>`;

    return;

  }



  // Ask floors first — or if floors set but _step is 0, show FC

  if(!pd.floors){

    document.getElementById('screen').innerHTML=`<div class="card">

      <div class="badge">🅿️ חניון</div>

      <div class="wq">כמה מפלסי חניון?</div>

      <div class="wh">מינוס 1, מינוס 2 וכו׳</div>

      <input id="inp" type="number" min="1" max="10" class="bnum" onkeydown="if(event.key==='Enter')setParkFloors()">

      <div style="margin-top:18px">

        <button class="nxt" onclick="setParkFloors()">המשך ←</button>

      </div>

    </div>`;

    setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);

    return;

  }



  const f = pd._floor||0;

  const s = pd._step||0;

  const step = PS[s];



  // Ensure fd exists and is properly initialized

  if(!pd.fd[f] && !pd.fd[''+f]) {

    pd.fd[f] = initPF();

  }

  const fd = pd.fd[f] || pd.fd[''+f];

  // Safety: ensure fans array always exists

  if(!fd.fans) fd.fans = [];

  if(fd._fanI === undefined) fd._fanI = 0;



  const n = `מינוס ${f+1}`;



  renderPStep(f, fd, step, n, pd);

}



function setParkFloors(){

  const v=parseInt(document.getElementById('inp').value)||0;

  if(v<1){shk('inp');return;}

  St.parkData.floors=v;

  St.parkData._floor=0;

  St.parkData._step=0;

  St.parkData.fd={};
  for(let i=0;i<v;i++){St.parkData.fd[i]=initPF();}

  setTimeout(()=>render(),50);

}



function pNext(){

  const pd=St.parkData;

  pd._step=(pd._step||0)+1;

  if(pd._step>=PS.length){

    if((pd._floor||0)+1<pd.floors){

      // More floors remain

      pd._floor=(pd._floor||0)+1;

      pd._step=0;

    } else {

      // ALL FLOORS DONE — show choice screen, don't auto-navigate

      pd.done=true;

      pd._showDoneScreen=true;

    }

  }

  render();

}



function parkingFinishOnly(){

  // Save parking only, go to summary/report without building or roof

  St.parkData.done=true;

  St.parkData._showDoneScreen=false;

  St.currentStep='done';

  render();

}



function parkingContinueToBuilding(){

  St.parkData.done=true;

  St.parkData._showDoneScreen=false;

  St.currentStep='building';

  if(!St.buildData)St.buildData={groups:[],_nextFloor:1,done:false};

  render();

}

function pBack(){

  const pd=St.parkData;

  if((pd._step||0)>0)pd._step--;

  else if((pd._floor||0)>0){pd._floor--;pd._step=PS.length-1;}

  render();

}



function parkTabs(){

  const pd=St.parkData;

  let h='<div class="ftabs">';

  for(let i=0;i<pd.floors;i++){const d=i<(pd._floor||0),a=i===(pd._floor||0);h+=`<div class="ftab ${a?'act':d?'done':''}">${d?'✓ ':''}מינוס ${i+1}</div>`;}

  return h+'</div>';

}



function renderPStep(f,fd,step,n,pd){

  const tabs=parkTabs();

  const skip=`<button class="skip" onclick="pNext()">סיים ועבור ↓</button>`;



  // Auto-skips — NEVER skip FANS automatically, always show it if fc>0

  if(step==='FANS'&&(fd.fc||0)===0){pNext();return;}  // only skip if truly 0



  if(step==='SIL_TYPE'&&!fd.hasSil){pNext();return;}

  if(step==='SIL_DIR'&&!fd.hasSil){pNext();return;}

  if(step==='DMP_LOOP'&&!fd.hasDmp){pNext();return;}

  if(step==='NR_QTY'&&!fd.hasNR){pNext();return;}

  if(step==='SW'){if(St.aboveFloors<11||fd.hasSW===false){pNext();return;}}

  if(step==='CAB_T'&&fd.fc===0){pNext();return;}

  if(step==='CAB_M'&&!fd.cabT){pNext();return;}

  if(step==='BRD_QTY'&&!fd.hasB){pNext();return;}

  if(step==='CO_QTY'&&!fd.hasCO){pNext();return;}

  if(step==='GR_LOOP'&&!fd.hasGr){pNext();return;}



  const sc=document.getElementById('screen');



  if(step==='FC'){

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🔄 ${n} | מפוחים</div>

      <div class="wq">כמה מפוחים בקומה ${n}?</div>

      <div class="wh">הזן 0 אם אין מפוחים בקומה זו</div>

      <input id="inp" type="number" min="0" value="${fd.fc!==undefined&&fd.fc!==null?fd.fc:''}" placeholder="הזן מספר..." class="bnum" onkeydown="if(event.key==='Enter')subFC(${f})">

      <div style="display:flex;gap:8px;margin-top:18px">

        <button class="bck" onclick="pBack()">→ חזור</button>

        <button class="nxt" onclick="subFC(${f})">המשך ←</button>

        ${skip}

      </div>

    </div>`;

    setTimeout(()=>{const e=document.getElementById('inp');if(e){e.focus();e.select();}},30);

    return;

  }



  if(step==='FANS'){

    // Safety: ensure fans array exists

    if(!fd.fans)fd.fans=[];

    if(fd._fanI===undefined)fd._fanI=0;

    const added=(fd.fans||[]).reduce((s,fn)=>s+(fn.qty||0),0);

    const rem=(fd.fc||0)-added;

    if(rem<=0){pNext();return;}

    const fi=fd._fanI||0;

    const cur=fd.fans[fi]||{model:'',motorIdx:0,qty:0,_mp:false};

    // Make sure cur is in the array (not just a default)

    if(!fd.fans[fi])fd.fans[fi]=cur;

    const FM=Object.keys(P.fans);

    let mH='';

    if(cur.model){

      const sm=cur.motorIdx||0;

      const btns=MOTORS.map((m,i)=>{const ex=i>MBASE?(i-MBASE)*MSURCH:0;return`<button class="mbtn ${sm===i?'sel':''}" onclick="pickM_p(${f},${fi},${i})">${m} kW${ex?' +'+ex:''}</button>`;}).join('');

      const ep=sm>MBASE?(sm-MBASE)*MSURCH:0;

      mH=`<div style="font-size:13px;font-weight:600;color:var(--muted);margin:13px 0 8px">⚡ בחר מנוע:</div><div class="motors">${btns}</div><div class="pprev">מחיר: <strong>${fmt(fprice(cur.model,sm))}</strong>${ep?' (+'+fmt(ep)+')':''}</div>`;

    }

    const showQ=cur.model&&cur._mp;

    const addedList=(fd.fans||[]).filter(fn=>fn.qty>0).map(fn=>`${fn.model} ${MOTORS[fn.motorIdx||0]}kW ×${fn.qty}`).join(' | ');

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🔄 ${n} | מפוח סוג ${fi+1} (נותרו ${rem})</div>

      <div class="wq">בחר דגם ומנוע</div>

      <div class="info">✓ הוזנו ${added} מתוך ${fd.fc}${addedList?' — <strong>'+addedList+'</strong>':''}</div>

      <div class="grid">${FM.map(m=>`<button class="opt ${cur.model===m?'sel':''}" onclick="pickMdl_p(${f},${fi},'${m}')">${m}</button>`).join('')}</div>

      ${mH}

      ${showQ?`<div style="margin-top:14px"><div style="font-size:14px;font-weight:600;margin-bottom:8px">כמה מסוג זה? (נותרו ${rem})</div>

      <div style="display:flex;align-items:center;gap:10px"><input id="fq" type="number" min="1" max="${rem}" value="${Math.min(rem,1)}" class="bnum" onkeydown="if(event.key==='Enter')subFQ(${f},${fi},${rem})"><button class="nxt" onclick="subFQ(${f},${fi},${rem})">הוסף ←</button></div></div>`:''}

      <div style="display:flex;gap:8px;margin-top:14px">

        <button class="bck" onclick="pBack()">→ חזור</button>

        ${added>0?`<button class="skip" onclick="pNext()">סיים מפוחים ↓</button>`:''}

      </div>

    </div>`;

    if(showQ)setTimeout(()=>{const e=document.getElementById('fq');if(e)e.focus();},30);

    return;

  }



  if(step==='SIL_Q'){

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🔇 ${n} | משתיקים</div>

      <div class="wq">האם יש משתיקי קול?</div>

      <div class="grid">

        <button class="yn ${fd.hasSil===true?'y':''}" onclick="St.parkData.fd[${f}].hasSil=true;pNext()">✓ כן</button>

        <button class="yn ${fd.hasSil===false?'n':''}" onclick="St.parkData.fd[${f}].hasSil=false;pNext()">✕ לא</button>

      </div>

      <div style="margin-top:10px"><button class="bck" onclick="pBack()">→ חזור</button></div>

    </div>`;return;

  }



  if(step==='SIL_TYPE'){

    const fm=fd.fans[0]&&fd.fans[0].model, d=fm&&P.sil[fm]?P.sil[fm]:null;

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🔇 ${n} | סוג משתיק</div>

      <div class="wq">איזה סוג משתיק?</div><div class="wh">1D ו-2D הם מוצרים שונים</div>

      ${d?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">

        <div style="background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--border)"><div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px">1D</div><div style="font-size:15px;font-weight:700">${fmt(d.p1)}</div></div>

        <div style="background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--border)"><div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px">2D</div><div style="font-size:15px;font-weight:700">${fmt(d.p2)}</div></div>

      </div>`:''}

      <div class="grid">

        <button class="opt ${fd.silT==='1d'?'sel':''}" onclick="St.parkData.fd[${f}].silT='1d';pNext()">1D — קצר</button>

        <button class="opt ${fd.silT==='2d'?'sel':''}" onclick="St.parkData.fd[${f}].silT='2d';pNext()">2D — ארוך</button>

      </div>

      <div style="margin-top:10px"><button class="bck" onclick="pBack()">→ חזור</button></div>

    </div>`;return;

  }



  if(step==='SIL_DIR'){

    const tot=fd.fans.reduce((s,fn)=>s+(fn.qty||0),0);

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🔇 ${n} | ${(fd.silT||'').toUpperCase()} — כיוון</div>

      <div class="wq">האם משני כיוונים?</div>

      <div class="wh">כן = 2 יח' למפוח (${tot*2}) | לא = 1 יח' (${tot})</div>

      <div class="grid">

        <button class="yn ${fd.silDir===true?'y':''}" onclick="St.parkData.fd[${f}].silDir=true;pNext()">✓ כן — 2 יח'</button>

        <button class="yn ${fd.silDir===false?'n':''}" onclick="St.parkData.fd[${f}].silDir=false;pNext()">✕ לא — 1 יח'</button>

      </div>

      <div style="margin-top:10px"><button class="bck" onclick="pBack()">→ חזור</button></div>

    </div>`;return;

  }



  if(step==='DMP_Q'){

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🌬️ ${n} | דמפרים</div>

      <div class="wq">האם יש דמפרים?</div>

      <div class="grid">

        <button class="yn ${fd.hasDmp===true?'y':''}" onclick="St.parkData.fd[${f}].hasDmp=true;St.parkData.fd[${f}].dmps=[];pNext()">✓ כן</button>

        <button class="yn ${fd.hasDmp===false?'n':''}" onclick="St.parkData.fd[${f}].hasDmp=false;pNext()">✕ לא</button>

      </div>

      <div style="margin-top:10px"><button class="bck" onclick="pBack()">→ חזור</button></div>

    </div>`;return;

  }



  if(step==='DMP_LOOP'){

    const hasFD=fd.dmps.find(d=>d.t==='fd'), hasFSD=fd.dmps.find(d=>d.t==='fsd');

    const addH=fd.dmps.length?`<div class="added">✓ ${fd.dmps.map(d=>(d.t==='fd'?'FD':'FSD')+' × '+d.qty).join(' | ')}</div>`:'';

    if(!fd._dmpT){

      const opts=[];

      if(!hasFD)opts.push({v:'fd',l:`FD אש — ${fmt(P.dmp.fd.pc)}`});

      if(!hasFSD)opts.push({v:'fsd',l:`FSD עשן — ${fmt(P.dmp.fsd.pc)}`});

      if(!opts.length){pNext();return;}

      sc.innerHTML=`${tabs}<div class="card">

        <div class="badge">🌬️ ${n} | דמפר — סוג</div><div class="wq">איזה סוג?</div>

        ${addH}

        <div class="grid">${opts.map(o=>`<button class="opt" onclick="St.parkData.fd[${f}]._dmpT='${o.v}';render()">${o.l}</button>`).join('')}</div>

        <div style="display:flex;gap:8px;margin-top:12px">

          <button class="bck" onclick="pBack()">→ חזור</button>

          ${fd.dmps.length?`<button class="nxt" onclick="pNext()">סיים ←</button>`:''}

          ${skip}

        </div>

      </div>`;

    } else {

      const lbl=fd._dmpT==='fd'?'FD אש':'FSD עשן';

      sc.innerHTML=`${tabs}<div class="card">

        <div class="badge">🌬️ ${n} | ${lbl} — כמות</div><div class="wq">כמה יחידות?</div>

        ${addH}

        <input id="inp" type="number" min="1" class="bnum" onkeydown="if(event.key==='Enter')subDmp(${f})">

        <div style="display:flex;gap:8px;margin-top:18px">

          <button class="bck" onclick="St.parkData.fd[${f}]._dmpT='';render()">→ חזור</button>

          <button class="nxt" onclick="subDmp(${f})">הוסף ←</button>

        </div>

      </div>`;

      setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);

    }

    return;

  }



  if(step==='NR_Q'){

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🌬️ ${n} | אל-חזור</div>

      <div class="wq">האם יש דמפרי אל-חזור?</div>

      <div class="grid">

        <button class="yn ${fd.hasNR===true?'y':''}" onclick="St.parkData.fd[${f}].hasNR=true;pNext()">✓ כן</button>

        <button class="yn ${fd.hasNR===false?'n':''}" onclick="St.parkData.fd[${f}].hasNR=false;pNext()">✕ לא</button>

      </div>

      <div style="margin-top:10px"><button class="bck" onclick="pBack()">→ חזור</button></div>

    </div>`;return;

  }



  if(step==='NR_QTY'){

    sc.innerHTML=`${tabs}<div class="card">

      <div class="badge">🌬️ ${n} | אל-חזור — כמות</div>

      <div class="wq">כמה דמפרי אל-חזור?</div>

      <div class="wh">${fmt(P.dmp.nr.pc)} ציוד</div>

      <input id="inp" type="number" min="1" value="${fd.nrQ||''}" class="bnum" onkeydown="if(event.key==='Enter')subNR(${f})">

      <div style="display:flex;gap:8px;margin-top:18px">

        <button class="bck" onclick="pBack()">→ חזור</button>

        <button class="nxt" onclick="subNR(${f})">המשך ←</button>

      </div>

    </div>`;

    setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);return;

  }



  if(step==='SW'){

    if(fd.hasSW===null||fd.hasSW===undefined){

      sc.innerHTML=`${tabs}<div class="card">

        <div class="badge">🚪 ${n} | דמפר מדרגות</div>

        <div class="wq">האם יש דמפרי חדר מדרגות?</div>

        <div class="info">🏢 ${St.aboveFloors} קומות — דמפרי מדרגות רלוונטיים</div>

        <div class="grid">

          <button class="yn" onclick="St.parkData.fd[${f}].hasSW=true;render()">✓ כן</button>

          <button class="yn n" onclick="St.parkData.fd[${f}].hasSW=false;pNext()">✕ לא</button>

    const addH=(fd.grs||[]).length?`<div class="added">✓ ${fd.grs.map(g=>g.t+' × '+g.qty).join(' | ')}</div>`:'';

      setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);

// Helper: get fd by floor index regardless of key type (number vs string after JSON.parse)

function getFD(f){return St.parkData.fd[f]||St.parkData.fd[''+f];}

function setFD(f,obj){const existing=St.parkData.fd[f]||St.parkData.fd[''+f];if(existing)Object.assign(existing,obj);else St.parkData.fd[f]=obj;}



function subFC(f){

  const el=document.getElementById('inp');

  const raw=el?el.value:'';

  if(raw===''||raw===null){shk('inp');return;}  // must enter something

  const v=parseInt(raw)||0;

  let fd=getFD(f);

  if(!fd){St.parkData.fd[f]=initPF();fd=St.parkData.fd[f];}

  fd.fc=v;

  fd.fans=[];

  fd._fanI=0;

  pNext();

}

function pickMdl_p(f,fi,m){const fd=getFD(f);if(!fd)return;if(!fd.fans[fi])fd.fans[fi]={model:'',motorIdx:0,qty:0,_mp:false};fd.fans[fi].model=m;fd.fans[fi]._mp=false;render();}

function pickM_p(f,fi,i){const fd=getFD(f);if(!fd)return;if(!fd.fans[fi])fd.fans[fi]={model:'',motorIdx:0,qty:0,_mp:false};fd.fans[fi].motorIdx=i;fd.fans[fi]._mp=true;render();}

function subFQ(f,fi,rem){const el=document.getElementById('fq');const qty=Math.min(parseInt(el?el.value:1)||1,rem);const fd=getFD(f);if(!fd)return;fd.fans[fi].qty=qty;fd._fanI=fi+1;updSum();const added=fd.fans.reduce((s,fn)=>s+(fn.qty||0),0);if(added>=fd.fc)pNext();else render();}

function subDmp(f){const qty=parseInt(document.getElementById('inp').value)||0;if(qty<1){shk('inp');return;}const fd=getFD(f);fd.dmps.push({t:fd._dmpT,qty});fd._dmpT='';render();}

function subNR(f){const v=parseInt(document.getElementById('inp').value)||0;if(v<1){shk('inp');return;}getFD(f).nrQ=v;pNext();}

function subSW(f){const v=parseInt(document.getElementById('inp').value)||0;if(v<1){shk('inp');return;}getFD(f).swQ=v;pNext();}

function togDuct(f,k,on){const fd=getFD(f);if(!fd.ducts)fd.ducts=[];if(on){if(!fd.ducts.find(d=>d.k===k))fd.ducts.push({k,m2:0});}else fd.ducts=fd.ducts.filter(d=>d.k!==k);render();}

function saveDucts(f){const fd=getFD(f);(fd.ducts||[]).forEach(d=>{const el=document.getElementById('dm-'+d.k);if(el)d.m2=parseFloat(el.value)||0;});pNext();}

function subCabM(f){const v=parseFloat(document.getElementById('inp').value)||0;getFD(f).cabM=v;pNext();}

function subBrd(f){const v=parseInt(document.getElementById('inp').value)||1;getFD(f).bQ=v;pNext();}

function subCO(f){const v=parseInt(document.getElementById('inp').value)||0;if(v<1){shk('inp');return;}const fd=getFD(f);fd.coQ=v;pNext();}

function subGr(f){const qty=parseInt(document.getElementById('inp').value)||0;if(qty<1){shk('inp');return;}const fd=getFD(f);fd.grs.push({t:fd._grT,qty});fd._grT='';render();}

const BLD_STEPS=['SMOKE_TYPE','ELBOW_LOBBY','ELBOW_TRASH','ELBOW_STORAGE','FD','VENT_Q','VENT_SUPPLIER','VENT_TYPE','VENT_QTY'];



function screenBuilding(){

  setPill('שלב 3 — מבנה');

  document.getElementById('lsum').style.display='block';

  updSum();

  if(!St.buildData)St.buildData={groups:[],_nextFloor:1,done:false,_bg:null};

  const bd=St.buildData, sc=document.getElementById('screen');

  const parkBanner=St.parkData.done?`<div class="phase-done"><div><div class="phase-done-t">✅ חניון — נשמר</div><div class="phase-done-s">${fmt(calcParking().eq+calcParking().ins)}</div></div><button class="bck" onclick="goBackToParking()">ערוך</button></div>`:'';



  if(bd.done){

    sc.innerHTML=parkBanner+`<div class="phase-done" style="border-color:var(--or)"><div><div class="phase-done-t" style="color:var(--or)">✅ מבנה — הושלם</div><div class="phase-done-s">${bd.groups.length} קבוצות | ${bd.groups.reduce((s,g)=>s+g.count,0)} קומות</div></div><button class="bck" onclick="editBuilding()">ערוך</button></div>

      <div class="card" style="text-align:center;padding:28px"><div style="font-size:13px;color:var(--muted);margin-bottom:18px">המבנה הושלם — ניתן לעבור לגג</div><button class="nxt" onclick="St.currentStep='roof';St.roofData=null;St._roofStep='';render()">המשך לגג ←</button></div>`;

    return;

  }

  if(!bd._bg){

    const nf=bd._nextFloor,tot=St.aboveFloors;

    if(nf>tot){bd.done=true;render();return;}

    sc.innerHTML=parkBanner+`<div class="card">

      <div class="badge">🏢 מבנה — קומה ${nf}</div>

      <div class="wq">אפיון קומה ${nf}</div>

      <div class="wh">האם קומה טיפוסית? עד איזו קומה?</div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">

        <label style="font-size:14px;font-weight:500">קומה ${nf} עד:</label>

        <input id="bg-to" type="number" min="${nf}" max="${tot}" value="${nf}" class="bnum" onkeydown="if(event.key==='Enter')startBG()">

      </div>

      <div style="font-size:13px;color:var(--muted);margin-bottom:14px">הזן ${nf} = קומה בודדת</div>

      <button class="nxt" onclick="startBG()">התחל אפיון ←</button>

    </div>`;

    setTimeout(()=>{const e=document.getElementById('bg-to');if(e)e.focus();},30);

    return;

  }

  renderBGStep(parkBanner);

}



function startBG(){

  const from=St.buildData._nextFloor;

  const toEl=document.getElementById('bg-to');

  const to=Math.max(from,parseInt(toEl?toEl.value:from)||from);

  St.buildData._bg={fromFloor:from,toFloor:to,count:to-from+1,smokeType:'',roofFan:false,elbows_lobby:[],elbows_trash:[],elbows_storage:[],fireDampers:[],hasVent:null,ventSupplier:'',ventType:'',ventQty:0,_step:'SMOKE_TYPE',_eArea:'',_ePhase:'',_eSect:'',_fdPhase:'',_fdSect:''};

  render();

}



function bgNext(){const bg=St.buildData._bg,i=BLD_STEPS.indexOf(bg._step),n=i>=0&&i+1<BLD_STEPS.length?BLD_STEPS[i+1]:'__done__';bg._step=n;if(n==='__done__')finishBG();else render();}

function bgBack(){const bg=St.buildData._bg,i=BLD_STEPS.indexOf(bg._step);if(i>0)bg._step=BLD_STEPS[i-1];else St.buildData._bg=null;render();}

function editBuilding(){St.buildData.done=false;if(St.buildData.groups.length){const l=St.buildData.groups.pop();St.buildData._nextFloor=l.fromFloor;}render();}

function finishBG(){const g=Object.assign({},St.buildData._bg);['_step','_eArea','_ePhase','_eSect','_fdPhase','_fdSect'].forEach(k=>delete g[k]);St.buildData.groups.push(g);St.buildData._nextFloor=(g.toFloor||g.fromFloor)+1;St.buildData._bg=null;updSum();render();}

function goBackToParking(){St.parkData.done=false;St.currentStep='parking';St.parkData._step=PS.length-1;render();}



function renderBGStep(parkBanner){

  const bg=St.buildData._bg,step=bg._step,sc=document.getElementById('screen');

  const n=bg.fromFloor===bg.toFloor?`קומה ${bg.fromFloor}`:`קומות ${bg.fromFloor}–${bg.toFloor}`;

  const done_grps=St.buildData.groups.length?`<div class="added">✓ הושלמו: ${St.buildData.groups.map(g=>g.fromFloor===g.toFloor?`ק${g.fromFloor}`:`ק${g.fromFloor}–${g.toFloor}`).join(', ')}</div>`:'';



  if(step==='SMOKE_TYPE'){

    sc.innerHTML=parkBanner+`<div class="card"><div class="badge">🏢 מבנה | ${n}</div><div class="wq">שחרור עשן בלובאים</div><div class="wh">מאולץ = מפוח גג יתווסף אוטומטית</div>${done_grps}<div class="grid"><button class="opt ${bg.smokeType==='natural'?'sel':''}" onclick="St.buildData._bg.smokeType='natural';bgNext()">🌬️ טבעי</button><button class="opt ${bg.smokeType==='forced'?'sel':''}" onclick="St.buildData._bg.smokeType='forced';St.buildData._bg.roofFan=true;bgNext()">⚡ מאולץ</button></div><div style="margin-top:12px"><button class="bck" onclick="bgBack()">→ חזור</button></div></div>`;

    return;

  }



  if(step==='ELBOW_LOBBY'||step==='ELBOW_TRASH'||step==='ELBOW_STORAGE'){

    const area=step==='ELBOW_LOBBY'?'lobby':step==='ELBOW_TRASH'?'trash':'storage';

    const lbl=step==='ELBOW_LOBBY'?'ברכי עשן בלובאים':step==='ELBOW_TRASH'?'ברכי עשן לאשפה':'ברכי עשן למחסנים';

    renderElbowStep(area,lbl,n,parkBanner);return;

  }



  if(step==='FD'){

    const fdList=bg.fireDampers||[],addH=fdList.length?`<div class="added">✓ ${fdList.map(d=>d.section+' × '+d.qty).join(' | ')}</div>`:'';

    if(!bg._fdPhase){

      sc.innerHTML=parkBanner+`<div class="card"><div class="badge">🔥 ${n} | מדפי אש FD</div><div class="wq">האם יש מדפי אש FD?</div>${addH}<div class="grid"><button class="yn y" onclick="St.buildData._bg._fdPhase='sect';render()">✓ כן</button><button class="yn n" onclick="bgNext()">✕ לא / סיים</button></div><div style="margin-top:10px"><button class="bck" onclick="bgBack()">→ חזור</button></div></div>`;

    }else if(bg._fdPhase==='sect'){

      sc.innerHTML=parkBanner+`<div class="card"><div class="badge">🔥 FD — חתך</div><div class="wq">מה חתך מדף האש?</div>${addH}<input id="inp" type="text" class="tin" placeholder='למשל: 0.3 מ"ר' onkeydown="if(event.key==='Enter')fdToQty()"><div style="display:flex;gap:8px;margin-top:16px"><button class="bck" onclick="St.buildData._bg._fdPhase='';render()">→ חזור</button><button class="nxt" onclick="fdToQty()">המשך ←</button></div></div>`;

      setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);

    }else{

      sc.innerHTML=parkBanner+`<div class="card"><div class="badge">🔥 FD חתך ${bg._fdSect}</div><div class="wq">כמה יחידות לקומה?</div>${addH}<input id="inp" type="number" min="1" class="bnum" onkeydown="if(event.key==='Enter')subFD_b()"><div style="display:flex;gap:8px;margin-top:18px"><button class="bck" onclick="St.buildData._bg._fdPhase='sect';render()">→ חזור</button><button class="nxt" onclick="subFD_b()">הוסף ←</button></div></div>`;

      setTimeout(()=>{const e=document.getElementById('inp');if(e)e.focus();},30);

    }

    return;

  }



  if(step==='VENT_Q'){

    sc.innerHTML=parkBanner+`<div class="card"><div class="badge">🌀 וונטות | ${n}</div><div class="wq">האם יש וונטות בדירות?</div><div class="wh">×${bg.count} קומות אוטומטית</div><div class="grid"><button class="yn y" onclick="St.buildData._bg.hasVent=true;bgNext()">✓ כן</button><button class="yn n" onclick="St.buildData._bg.hasVent=false;finishBG()">✕ לא — סיים קבוצה</button></div><div style="margin-top:10px"><button class="bck" onclick="bgBack()">→ חזור</button></div></div>`;

    return;

  }

  if(step==='VENT_SUPPLIER'){

    if(!bg.hasVent){finishBG();return;}

function calcPF(fd){

  let eq=0,ins=0,tin=0,elec=0;

  const totF=(fd.fans||[]).reduce((s,fn)=>s+(fn.qty||0),0);

  (fd.fans||[]).forEach(fn=>{if(fn.model&&P.fans[fn.model]){const q=fn.qty||0;eq+=fprice(fn.model,fn.motorIdx||0)*q;const i=P.fans[fn.model].pi*q;ins+=i;elec+=i;}});

  if(fd.hasSil&&fd.silT&&fd.silDir!==null&&totF>0){const fm=fd.fans[0]&&fd.fans[0].model;if(fm&&P.sil[fm]){const d=P.sil[fm];const price=fd.silT==='2d'?d.p2:d.p1;const qty=fd.silDir?totF*2:totF;const cs=fd.silDir?P.cab_side*2:P.cab_side;eq+=price*qty;const i=(d.i+cs)*qty;ins+=i;tin+=i;}}

  (fd.dmps||[]).forEach(d=>{const info=d.t==='fd'?P.dmp.fd:P.dmp.fsd;eq+=info.pc*d.qty;const i=info.ic*d.qty;ins+=i;tin+=i;});

  if(fd.hasNR&&fd.nrQ>0){eq+=P.dmp.nr.pc*fd.nrQ;const i=P.dmp.nr.ic*fd.nrQ;ins+=i;tin+=i;}

  if(fd.hasSW&&fd.swQ>0){eq+=P.dmp.sw.pc*fd.swQ;const i=P.dmp.sw.ic*fd.swQ;ins+=i;tin+=i;}

  (fd.ducts||[]).forEach(d=>{const dt=P.duct.find(x=>x.k===d.k);if(dt&&d.m2>0){eq+=dt.pc*d.m2;const i=dt.ic*d.m2;ins+=i;tin+=i;}});

  if(fd.cabT&&fd.cabM>0&&P.cab[fd.cabT]){eq+=P.cab[fd.cabT].pc*fd.cabM;const i=P.cab[fd.cabT].ic*fd.cabM;ins+=i;elec+=i;}

  if(fd.hasB&&fd.bQ>0){eq+=P.board.pc*fd.bQ*totF;const i=P.board.ic*fd.bQ;ins+=i;elec+=i;}

  if(fd.hasCO&&fd.coQ>0){eq+=P.co_hub.pc+P.co_det.pc*fd.coQ;const i=P.co_hub.ic+P.co_det.ic*fd.coQ;ins+=i;elec+=i;}

  (fd.grs||[]).forEach(g=>{if(P.gr[g.t]){eq+=P.gr[g.t].pc*g.qty;const i=P.gr[g.t].ic*g.qty;ins+=i;tin+=i;}});

  return{eq,ins,tin,elec};

}



function calcParking(){

  let eq=0,ins=0,tin=0,elec=0;

  const pd=St.parkData;

  for(let i=0;i<(pd.floors||0);i++){const c=calcPF(pd.fd[i]||pd.fd[''+i]||{fans:[],dmps:[],grs:[],ducts:[]});eq+=c.eq;ins+=c.ins;tin+=c.tin;elec+=c.elec;}

  return{eq,ins,tin,elec};

}



function calcBuilding(){

  let eq=0,ins=0,tin=0,elec=0;

  const bd=St.buildData;

  if(!bd||!bd.groups)return{eq,ins,tin,elec};

  bd.groups.forEach(bg=>{

    const c=bg.count||1;

    ['elbows_lobby','elbows_trash','elbows_storage'].forEach(key=>{

      (bg[key]||[]).forEach(e=>{

        const info=e.section==='0.3'?P.elbow03:P.elbow015;

        const q=(e.qty||0)*c;

        eq+=info.pc*q;const i=info.ic*q;ins+=i;tin+=i;

        eq+=P.gr_bld.pc*q;const gi=P.gr_bld.ic*q;ins+=gi;tin+=gi;

      });

    });

    (bg.fireDampers||[]).forEach(fd=>{

      const q=(fd.qty||0)*c;

      eq+=P.dmp.fd.pc*q;const i=P.dmp.fd.ic*q;ins+=i;tin+=i;

    });

    if(bg.hasVent&&bg.ventQty>0){

      const q=(bg.ventQty||0)*c;

      eq+=P.vent.pc*q;const vi=P.vent.ic*q;ins+=vi;tin+=vi;

      const dp=bg.ventType==='flex'?P.flex:P.spiral;

      eq+=dp.pc*q;const di=dp.ic*q;ins+=di;tin+=di;

    }

  });

  return{eq,ins,tin,elec};

}



function calcRoof(){

  let eq=0,ins=0,tin=0,elec=0;

  const rd=St.roofData;

  if(!rd)return{eq,ins,tin,elec};

  (rd.pressFans||[]).forEach(f=>{if(f.model&&P.fans[f.model]){const q=f.qty||1;eq+=fprice(f.model,f.mi||0)*q;const i=P.fans[f.model].pi*q;ins+=i;elec+=i;}});

  if(rd.stairsDmpQty>0){eq+=P.dmp.sw.pc*rd.stairsDmpQty;const i=P.dmp.sw.ic*rd.stairsDmpQty;ins+=i;tin+=i;}

  if(rd.hasSvc&&rd.svcQty>0){

    let base=P.rf.pc;

    if(rd.svcAcoustic){base+=rd.svcModel==='DD'?1300:rd.svcModel==='SBI'?3500:0;}

    const mi=rd.svcMotorIdx||0;base+=mi>MBASE?(mi-MBASE)*MSURCH:0;

    const q=rd.svcQty||1;eq+=base*q;const i=P.rf.ic*q;ins+=i;elec+=i;

  }

  (rd.smokeFans||[]).forEach(f=>{if(f.model&&P.fans[f.model]){const q=f.qty||1;eq+=fprice(f.model,f.mi||0)*q;const i=P.fans[f.model].pi*q;ins+=i;elec+=i;}});

  if(rd.hasBoard){eq+=P.board.pc;const i=P.board.ic;ins+=i;elec+=i;}

  if(rd.cableLen>0){const ck=Object.keys(P.cab)[0];eq+=P.cab[ck].pc*rd.cableLen;const i=P.cab[ck].ic*rd.cableLen;ins+=i;elec+=i;}

  return{eq,ins,tin,elec};

}



function calcAll(){

  const p=calcParking();

  const b=calcBuilding();

  const r=calcRoof();

  return{

    eq:p.eq+b.eq+r.eq,

    ins:p.ins+b.ins+r.ins,

    tin:p.tin+b.tin+r.tin,

    elec:p.elec+b.elec+r.elec,

  };

}



function mkup(cost){

  const a1=cost*(1+M.mgmt/100),a2=a1*(1+M.acc/100),a3=a2*(1+M.oh/100),a4=a3*(1+M.pr/100);

  return{cost,mg:a1-cost,ac:a2-a1,oh:a3-a2,pr:a4-a3,a1,a2,a3,final:a4};

}

function subC(tin,elec){const f=(1+M.mgmt/100)*(1+M.acc/100)*(1+M.oh/100)*(1+M.pr/100);return{tn:tin,tf:Math.round(tin*f),en:elec,ef:Math.round(elec*f)};}



let _privMode=true, _privAuth=false;

function togglePrivacy(){

  if(!_privAuth){

    const pw=prompt('הזן סיסמת מנהל לצפייה בפירוט תמחור:');

    if(pw==='1234'){_privAuth=true;_privMode=false;}

    else if(pw!==null)alert('סיסמא שגויה');

    return;

  }

  _privMode=!_privMode;

  if(_privMode)_privAuth=false;

  updSum();

}



function buildDetailRows(f){

  const pd=St.parkData;

  const items=[];

  for(let fi=0;fi<(pd.floors||0);fi++){

    const fd=pd.fd[fi]||{};

    (fd.fans||[]).forEach(fn=>{if(fn.model&&(fn.qty||0)>0){const eqU=fprice(fn.model,fn.motorIdx||0);items.push({n:`מפוח ${fn.model} ${MOTORS[fn.motorIdx||0]}kW`,q:fn.qty,eqU,insU:P.fans[fn.model].pi});}});

    if(fd.hasSil&&fd.silT){const fm=fd.fans[0]&&fd.fans[0].model;if(fm&&P.sil[fm]){const d=P.sil[fm];const price=fd.silT==='2d'?d.p2:d.p1;const totF=fd.fans.reduce((s,fn)=>s+(fn.qty||0),0);const qty=fd.silDir?totF*2:totF;items.push({n:`משתיק ${fd.silT.toUpperCase()}`,q:qty,eqU:price,insU:d.i+P.cab_side});}}

    (fd.dmps||[]).forEach(d=>{const info=d.t==='fd'?P.dmp.fd:P.dmp.fsd;items.push({n:d.t==='fd'?'דמפר FD':'FSD',q:d.qty,eqU:info.pc,insU:info.ic});});

    if(fd.hasNR&&fd.nrQ>0)items.push({n:'אל-חזור',q:fd.nrQ,eqU:P.dmp.nr.pc,insU:P.dmp.nr.ic});

    if(fd.hasSW&&fd.swQ>0)items.push({n:'דמפר מדרגות',q:fd.swQ,eqU:P.dmp.sw.pc,insU:P.dmp.sw.ic});

    (fd.ducts||[]).forEach(d=>{const dt=P.duct.find(x=>x.k===d.k);if(dt&&d.m2>0)items.push({n:dt.n,q:d.m2,eqU:dt.pc,insU:dt.ic});});

    if(fd.cabT&&fd.cabM>0&&P.cab[fd.cabT])items.push({n:fd.cabT,q:fd.cabM,eqU:P.cab[fd.cabT].pc,insU:P.cab[fd.cabT].ic});

    if(fd.hasB&&fd.bQ>0)items.push({n:'לוח חשמל',q:fd.bQ,eqU:P.board.pc,insU:P.board.ic});

    if(fd.hasCO&&fd.coQ>0){items.push({n:'רכזת CO',q:1,eqU:P.co_hub.pc,insU:P.co_hub.ic});items.push({n:'גלאי CO',q:fd.coQ,eqU:P.co_det.pc,insU:P.co_det.ic});}

    (fd.grs||[]).forEach(g=>{if(P.gr[g.t]&&g.qty>0)items.push({n:g.t,q:g.qty,eqU:P.gr[g.t].pc,insU:P.gr[g.t].ic});});

  }

  return items;

}



function updSum(){

  } else {

  Object.keys(P.sil).forEach(k=>{P.sil[k].p1=+document.getElementById('s1_'+k)?.value||0;P.sil[k].p2=+document.getElementById('s2_'+k)?.value||0;P.sil[k].i=+document.getElementById('si_'+k)?.value||0;});

  [['fd'],['fsd'],['nr'],['sw']].forEach(([k])=>{P.dmp[k].pc=+document.getElementById('dp_'+k)?.value||0;P.dmp[k].ic=+document.getElementById('di_'+k)?.value||0;});

  Object.keys(P.cab).forEach(k=>{const ks=k.replace(/[–\s]/g,'_');P.cab[k].pc=+document.getElementById('cp_'+ks)?.value||0;P.cab[k].ic=+document.getElementById('ci_'+ks)?.value||0;});

  P.duct.forEach(d=>{d.pc=+document.getElementById('dtp_'+d.k)?.value||0;d.ic=+document.getElementById('dti_'+d.k)?.value||0;});

  Object.keys(P.gr).forEach(k=>{const ks=k.replace(/[\s"']/g,'_');P.gr[k].pc=+document.getElementById('gp_'+ks)?.value||0;P.gr[k].ic=+document.getElementById('gi_'+ks)?.value||0;});

  P.board.pc=+document.getElementById('bpc')?.value||0;P.board.ic=+document.getElementById('bic')?.value||0;

  P.co_hub.pc=+document.getElementById('rkzpc')?.value||0;P.co_hub.ic=+document.getElementById('rkzic')?.value||0;

  P.co_det.pc=+document.getElementById('detpc')?.value||0;P.co_det.ic=+document.getElementById('detic')?.value||0;

  P.cab_side=+document.getElementById('cside')?.value||0;

  ['mgmt','acc','oh','pr'].forEach(k=>{M[k]=+document.getElementById('mk_'+k)?.value||0;});

  sP();sM();closeOv('adm-ov');updSum();alert('✓ נשמר!');

}

function openCR(){buildCR();document.getElementById('cr-ov').classList.add('open');}



function buildCR(){

  const contact=document.getElementById('cr-contact')?.value||'';

  const phone=document.getElementById('cr-phone')?.value||'';

  const email=document.getElementById('cr-email')?.value||'';

  const today=new Date().toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'numeric'});



  // Collect all items by section

  const secs=[];



  // PARKING ITEMS

  const pi=[];

  const pd=St.parkData;

  for(let fi=0;fi<(pd.floors||0);fi++){

    const fd=pd.fd[fi]||{};const n=`חניון מינוס ${fi+1}`;

    const totF=(fd.fans||[]).reduce((s,fn)=>s+(fn.qty||0),0);

    (fd.fans||[]).forEach(fn=>{if(fn.model&&(fn.qty||0)>0)pi.push({desc:`מפוח פינוי עשן ואוורור דגם ${fn.model}, הספק ${MOTORS[fn.motorIdx||0]} kW, עמיד חום 300°C/2h, כולל אספקה והתקנה`,qty:fn.qty,u:"יח'",area:n});});

    if(fd.hasSil&&fd.silT&&totF>0){const q=fd.silDir?totF*2:totF;pi.push({desc:`משתיק קול דגם ${fd.silT.toUpperCase()} (${fd.silDir?'דו-כיווני':'חד-כיווני'}), כולל אספקה והתקנה`,qty:q,u:"יח'",area:n});}

    (fd.dmps||[]).forEach(d=>{pi.push({desc:(d.t==='fd'?'דמפר אש FD':'דמפר עשן FSD')+', כולל אספקה והתקנה לפי תקן',qty:d.qty,u:"יח'",area:n});});

    if(fd.hasNR&&fd.nrQ>0)pi.push({desc:'דמפר אל-חזור, כולל אספקה והתקנה',qty:fd.nrQ,u:"יח'",area:n});

    if(fd.hasSW&&fd.swQ>0)pi.push({desc:'דמפר חדר מדרגות, כולל אספקה והתקנה לפי תקן',qty:fd.swQ,u:"יח'",area:n});

    (fd.ducts||[]).forEach(d=>{const dt=P.duct.find(x=>x.k===d.k);if(dt&&d.m2>0)pi.push({desc:`${dt.n}, כולל אספקה והתקנה`,qty:d.m2,u:dt.u,area:n});});

    if(fd.cabT&&fd.cabM>0)pi.push({desc:`${fd.cabT} חסין אש, כולל אספקה והנחה`,qty:fd.cabM,u:'מ"ר',area:n});

    if(fd.hasB&&fd.bQ>0)pi.push({desc:`לוח שליטה לפינוי עשן (${fd.bQ} לוחות), כולל אספקה והתקנה`,qty:fd.bQ,u:"יח'",area:n});

    if(fd.hasCO&&fd.coQ>0){pi.push({desc:'רכזת גילוי CO, כולל אספקה והתקנה',qty:1,u:"יח'",area:n});pi.push({desc:'גלאי CO, כולל אספקה והתקנה',qty:fd.coQ,u:"יח'",area:n});}

    (fd.grs||[]).forEach(g=>{if(g.qty>0)pi.push({desc:`${g.t}, כולל אספקה והתקנה`,qty:g.qty,u:"יח'",area:n});});

  }

  if(pi.length)secs.push({icon:'🅿️',cat:'אספקה והתקנה של מפוחי אוורור ושחרור עשן בחניון בהתאם לתקן 1001',items:pi});



  // BUILDING ITEMS

  const bi=[];

  const bd=St.buildData;

  if(bd&&bd.groups){

    bd.groups.forEach(bg=>{

      const n=bg.fromFloor===bg.toFloor?`קומה ${bg.fromFloor}`:`קומות ${bg.fromFloor}–${bg.toFloor}`;

      const c=bg.count||1;

      ['elbows_lobby','elbows_trash','elbows_storage'].forEach(key=>{

        const lbl=key==='elbows_lobby'?'לובאים':key==='elbows_trash'?'חדרי אשפה':'מחסנים';

        (bg[key]||[]).forEach(e=>{

          const tot=(e.qty||0)*c;

          bi.push({desc:`ברך עשן ${lbl} חתך ${e.section} מ"ר לפי תקן 1001, כולל אספקה והתקנה`,qty:tot,u:"יח'",area:n});

          bi.push({desc:`גריל פינוי עשן ${lbl} חתך ${e.section} מ"ר, כולל אספקה והתקנה`,qty:tot,u:"יח'",area:n});

        });

      });

      (bg.fireDampers||[]).forEach(fd=>{const tot=(fd.qty||0)*c;bi.push({desc:`מדף אש FD חתך ${fd.section}, כולל אספקה והתקנה`,qty:tot,u:"יח'",area:n});});

      if(bg.hasVent&&bg.ventQty>0){

        const tot=(bg.ventQty||0)*c;

        bi.push({desc:`וונטה דירתית${bg.ventSupplier==='sp'?' סיינר S&P':' ספק חיצוני'}, כולל אספקה והתקנה`,qty:tot,u:"יח'",area:n});

        bi.push({desc:`צנרת ${bg.ventType==='flex'?'שרשורית גמישה':'ספירקל קשיחה'}, כולל אספקה והנחה`,qty:tot,u:"מ'",area:n});

      }

    });

  }

  if(bi.length)secs.push({icon:'🏢',cat:'אספקה והתקנה של מערכות שחרור עשן ואוורור מבנה בהתאם לתקן 1001',items:bi});



  // ROOF ITEMS

  const ri=[];

  const rd=St.roofData;

  if(rd){

    (rd.pressFans||[]).forEach(f=>{if(f.model)ri.push({desc:`מפוח דיחוס ${f.model} הספק ${MOTORS[f.mi||0]} kW, כולל אספקה והתקנה`,qty:f.qty||1,u:"יח'",area:'גג'});});

    if(rd.stairsDmpQty>0)ri.push({desc:'דמפר ממונע בראש חדר מדרגות, כולל אספקה והתקנה לפי תקן',qty:rd.stairsDmpQty,u:"יח'",area:'גג'});

    if(rd.hasSvc&&rd.svcQty>0){const ac=rd.svcAcoustic?` (כולל טיפול אקוסטי +₪${rd.svcModel==='DD'?'1,300':rd.svcModel==='SBI'?'3,500':'—'})`:'';ri.push({desc:`מפוח שירותים ${rd.svcModel} הספק ${MOTORS[rd.svcMotorIdx||0]} kW${ac}, כולל אספקה והתקנה`,qty:rd.svcQty,u:"יח'",area:'גג'});}

    (rd.smokeFans||[]).forEach(f=>{if(f.model)ri.push({desc:`מפוח שחרור עשן ${f.model} הספק ${MOTORS[f.mi||0]} kW, כולל אספקה והתקנה`,qty:f.qty||1,u:"יח'",area:'גג'});});

    if(rd.hasBoard)ri.push({desc:'לוח חשמל ייעודי גג, כולל אספקה והתקנה',qty:1,u:"יח'",area:'גג'});

    if(rd.cableLen>0)ri.push({desc:'כבל חשמל חסין אש גג, כולל אספקה והנחה',qty:rd.cableLen,u:"מ'",area:'גג'});

  }

  if(ri.length)secs.push({icon:'🏠',cat:'אספקה והתקנה של מפוחי גג ומערכות גג בהתאם לתקן 1001',items:ri});



  // Build HTML


  // Compute final price
  const {eq,ins,tin,elec}=calcAll();
  const cost=eq+ins;
  const p=mkup(cost);
  const finalPrice=fmt(p.final);
  const quoteNum='Q-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5);

  let html=`<div class="cr-wrap">

    <!-- HEADER -->
    <div class="cr-header">
      <div class="cr-header-right">
        <img class="cr-logo-img" src="${LOGO_B64}" alt="Sieners SYV Group">
        <div class="cr-company-sub">מערכת אוורור ופינוי עשן</div>
      </div>
      <div class="cr-header-left">
        <div class="cr-quote-label">הצעת מחיר</div>
        <div class="cr-quote-num">${quoteNum}</div>
        <div class="cr-quote-date">${today}</div>
      </div>
    </div>

    <!-- PROJECT BAND -->
    <div class="cr-proj-band">
      <div>
        <div class="cr-proj-name">${St.pn||'—'}</div>
        <div class="cr-proj-client">${St.pc||''}</div>
      </div>
      <div class="cr-proj-right">
        ${contact?`<div class="cr-proj-contact-lbl">איש קשר</div><div class="cr-proj-contact-val">${contact}${phone?' · '+phone:''}</div>`:''}
        ${email?`<div class="cr-proj-contact-val" style="font-size:10px;opacity:.7;margin-top:2px">${email}</div>`:''}
      </div>
    </div>

    <!-- META ROW -->
    <div class="cr-meta-row">
      <div class="cr-meta-cell"><div class="cr-meta-lbl">תאריך</div><div class="cr-meta-val">${today}</div></div>
      <div class="cr-meta-cell"><div class="cr-meta-lbl">מספר הצעה</div><div class="cr-meta-val">${quoteNum}</div></div>
      ${St.aboveFloors?`<div class="cr-meta-cell"><div class="cr-meta-lbl">קומות מעל קרקע</div><div class="cr-meta-val">${St.aboveFloors}</div></div>`:''}
      ${St.parkData&&St.parkData.floors?`<div class="cr-meta-cell"><div class="cr-meta-lbl">מפלסי חניון</div><div class="cr-meta-val">${St.parkData.floors}</div></div>`:''}
    </div>

    <div style="padding:0 0 4px">`;

  if(secs.length===0){
    html+=`<div style="padding:40px;text-align:center;color:#aaa;font-size:13px">אין פריטים — יש להשלים את האפיון תחילה</div>`;
  } else {
    secs.forEach((sec,si)=>{
      html+=`
      <div class="cr-sec-head">
        <div class="cr-sec-num">${si+1}</div>
        <div class="cr-sec-title">${sec.cat}</div>
      </div>
      <table class="cr-table">
        <thead><tr>
          <th style="width:28px"></th>
          <th>תיאור הפריט</th>
          <th style="text-align:center;width:80px">כמות</th>
        </tr></thead>
        <tbody>
          ${sec.items.map((it,idx)=>`<tr>
            <td style="text-align:center;padding:6px 8px"><span class="cr-row-num">${idx+1}</span></td>

// ═══ LOGIN ═══
const LOGIN_HASH = 'e0bc60c82713f64ef8a57c0c40d02ce24fd0141d5cc3086259c19b1e62a62bea';

async function hashPw(pw){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin(){
  const pw = document.getElementById('login-pw').value;
  const h = await hashPw(pw);
  if(h === LOGIN_HASH){
    localStorage.setItem('sieners_auth','1');
    showApp();
  } else {
    const err = document.getElementById('login-err');
    err.style.display = 'block';
    document.getElementById('login-pw').style.borderColor = '#ff6b6b';
    setTimeout(()=>{
      err.style.display='none';
      document.getElementById('login-pw').style.borderColor='rgba(255,255,255,0.15)';
    }, 3000);
  }
}

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'block';
}

function logout(){
  localStorage.removeItem('sieners_auth');
  location.reload();
}

// הצג logout רק במובייל
if(window.innerWidth <= 600){
  const lb = document.getElementById('mobile-logout');
  if(lb) lb.style.display = 'block';
}

// בדוק אם כבר מחובר
if(localStorage.getItem('sieners_auth')==='1'){
  showApp();
}
